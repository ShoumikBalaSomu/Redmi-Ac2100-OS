# ===========================================================================
# NexRouter v2.0 — 128 MiB RAM-Safe High-Throughput Kernel Tuning
# ===========================================================================
# Sized specifically for MT7621A (128 MiB DDR3) so high flow counts never OOM
# hostapd or mt76 DMA rings (replaces v1's unsafe 65536 conntrack / 8MB buffers).

# --- Connection Tracking (16,384 entries = ~5 MiB slab max) ----------------
net.netfilter.nf_conntrack_max=16384
net.netfilter.nf_conntrack_buckets=4096
net.netfilter.nf_conntrack_tcp_timeout_established=7200
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
net.netfilter.nf_conntrack_tcp_timeout_close_wait=15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait=30
net.netfilter.nf_conntrack_udp_timeout=30
net.netfilter.nf_conntrack_udp_timeout_stream=120

# --- TCP / Socket Buffers & BBR Congestion Control (2 MiB cap) -------------
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.rmem_max=2097152
net.core.wmem_max=2097152
net.ipv4.tcp_rmem=4096 131072 2097152
net.ipv4.tcp_wmem=4096 131072 2097152
net.core.netdev_max_backlog=4096
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.core.somaxconn=2048
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_tw_reuse=1

# --- Network Filtering & Hardening -----------------------------------------
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.log_martians=0
net.ipv4.conf.default.log_martians=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_source_route=0

# --- Virtual Memory (128 MiB DDR3 Protection) ------------------------------
vm.swappiness=10
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.min_free_kbytes=4096
vm.vfs_cache_pressure=150
