# ===========================================================================
# NexRouter v3.6 — Zero-Drop LAN, PPE Flowtable & 64MB ZRAM Kernel Tuning
# ===========================================================================
# Engineered for Xiaomi Redmi Router AC2100 (MT7621AT + MT7530 + 128MB DDR3):
#   1. nf_conntrack_tcp_be_liberal=1: Prevents nftables/PPE hardware flowtable
#      from dropping mid-stream TCP packets as out-of-window (fixes sudden
#      LAN connection stalls and wireless TCP download drops).
#   2. rp_filter=2 (Loose RFC 3704): Prevents the kernel from blocking laptops
#      that connect via Wired LAN while Wi-Fi is still active (dual-homed).
#   3. Fast ARP/Neighbor garbage collection & gratuitous ARP acceptance so
#      roaming between Wi-Fi and LAN ports updates immediately.
#   4. vm.swappiness=100 + vm.page-cluster=0: Keeps the 64 MiB LZ4 ZRAM
#      virtual RAM multiplier active at all times.
# ===========================================================================

# --- Connection Tracking & Hardware PPE Flowtable Compatibility ------------
net.netfilter.nf_conntrack_max=16384
net.netfilter.nf_conntrack_buckets=4096
net.netfilter.nf_conntrack_tcp_be_liberal=1
net.netfilter.nf_conntrack_tcp_no_window_check=1
net.netfilter.nf_conntrack_tcp_timeout_established=3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
net.netfilter.nf_conntrack_tcp_timeout_close_wait=15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait=30
net.netfilter.nf_conntrack_udp_timeout=30
net.netfilter.nf_conntrack_udp_timeout_stream=120

# --- TCP / Socket Buffers & BBR Congestion Control (4 MiB ceiling) ---------
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_rmem=4096 131072 4194304
net.ipv4.tcp_wmem=4096 131072 4194304
net.core.netdev_max_backlog=8192
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.core.somaxconn=2048
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_window_scaling=1
net.ipv4.tcp_sack=1
net.ipv4.tcp_dsack=1

# --- Zero-Drop LAN & Dual-Homed Laptop Protection (Loose rp_filter=2) ------
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.all.arp_accept=1
net.ipv4.conf.default.arp_accept=1
net.ipv4.conf.all.arp_ignore=0
net.ipv4.conf.default.arp_ignore=0
net.ipv4.neigh.default.gc_stale_time=60
net.ipv4.neigh.default.gc_thresh1=512
net.ipv4.neigh.default.gc_thresh2=2048
net.ipv4.neigh.default.gc_thresh3=4096
net.ipv4.conf.all.log_martians=0
net.ipv4.conf.default.log_martians=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_source_route=0

# --- Virtual Memory (64 MiB ZRAM + 128 MiB DDR3 Synergy) -------------------
vm.swappiness=100
vm.page-cluster=0
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.min_free_kbytes=4096
vm.vfs_cache_pressure=150
